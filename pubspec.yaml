name: pdp_todo_app
description: "Flutter testing reference: lightweight Clean Architecture Todo app for unit, Bloc, widget, golden, and integration tests."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  get_it: ^9.2.1
  go_router: ^17.5.0
  home_widget: ^0.9.3
  talker_bloc_logger: ^5.1.20
  talker_flutter: ^5.1.20

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  pigeon: ^27.3.0
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
